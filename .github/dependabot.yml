version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/dev
      - /terraform/envs/prod
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]
