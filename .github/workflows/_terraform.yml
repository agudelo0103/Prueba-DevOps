# -----------------------------------------------------------------------------
# Workflow REUTILIZABLE: plan + apply de Terraform para un ambiente.
#
#   plan  -> rol OIDC de SOLO LECTURA. Genera tfplan, lo publica en el resumen
#            y (en PRs) como comentario. Sube el plan como artefacto.
#   apply -> corre dentro del GitHub Environment (dev / prod). En prod el
#            environment exige aprobación manual. Usa el rol OIDC de deploy del
#            ambiente y aplica EXACTAMENTE el plan revisado (no uno nuevo).
#            Al final publica el INVENTARIO de recursos del ambiente.
#
#   destroy: true -> el plan es "terraform plan -destroy"; el apply elimina
#            todos los recursos del ambiente (pasa por la misma compuerta).
#
#   Interruptor de costos: variable APPLY_ENABLED de cada GitHub Environment.
#   "false" = el pipeline planea y pasa la aprobación, pero no crea recursos.
#   (No bloquea un destroy: apagar un ambiente siempre está permitido.)
# -----------------------------------------------------------------------------
name: terraform (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Ambiente (dev | prod)
        type: string
        required: true
      image_tag:
        description: Tag de imagen a desplegar. Vacío = el que ya está desplegado.
        type: string
        default: ""
      apply:
        description: Ejecutar el job de apply (false = solo plan, p. ej. en PRs)
        type: boolean
        default: false
      destroy:
        description: true = planear y aplicar la DESTRUCCIÓN de todo el ambiente
        type: boolean
        default: false
    outputs:
      image_tag:
        description: Tag de imagen usado en el plan
        value: ${{ jobs.plan.outputs.image_tag }}
      app_url:
        description: URL de la aplicación tras el apply
        value: ${{ jobs.apply.outputs.app_url || jobs.plan.outputs.current_app_url }}
      applied:
        description: "'true' si se aplicó, 'false' si el interruptor APPLY_ENABLED lo impidió, vacío si no hubo cambios"
        value: ${{ jobs.apply.outputs.applied }}

permissions: {}

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.environment }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      current_app_url: ${{ steps.current.outputs.app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Credenciales AWS (OIDC, rol de solo lectura)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Orden: tag recibido -> tag desplegado en el ambiente -> tag de dev ->
      # SHA del commit (solo para poder planear antes del primer despliegue).
      - name: Resolver tag de imagen
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          TARGET_ENV: ${{ inputs.environment }}
          FALLBACK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          get_param() {
            aws ssm get-parameter --name "/prueba-devops/$1/image-tag" \
              --query Parameter.Value --output text 2>/dev/null || true
          }
          tag="$INPUT_TAG"
          [ -z "$tag" ] && tag="$(get_param "$TARGET_ENV")"
          [ -z "$tag" ] && tag="$(get_param dev)"
          [ -z "$tag" ] && tag="$FALLBACK_SHA" && echo "::notice::Sin despliegues previos; se planea con el SHA $tag"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Imagen a planear: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: terraform init
        run: terraform init -lockfile=readonly

      - name: URL actual (si el ambiente ya existe)
        id: current
        run: echo "app_url=$(terraform output -raw app_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: terraform plan${{ inputs.destroy && ' -destroy' || '' }}
        id: plan
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          mode=""
          [ "$DESTROY" = "true" ] && mode="-destroy" && echo "::warning::Plan de DESTRUCCIÓN del ambiente"
          set +e
          terraform plan $mode -detailed-exitcode -out=tfplan -var "image_tag=$IMAGE_TAG" -no-color > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          # 0 = sin cambios, 2 = hay cambios, 1 = error
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      - name: Resumen del plan
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DESTROY: ${{ inputs.destroy && 'true' || '' }}
        run: |
          {
            echo "### Terraform plan${DESTROY:+ (DESTROY)} — \`$TARGET_ENV\`"
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '<details><summary>Ver plan completo</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_ENV: ${{ inputs.environment }}
          PLAN_FILE: terraform/envs/${{ inputs.environment }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TARGET_ENV;
            const marker = `<!-- terraform-plan-${env} -->`;
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['(ver log)'])[0];
            const destroys = (plan.match(/will be destroyed|must be replaced/g) || []).length;
            const warning = destroys > 0
              ? `\n> [!WARNING]\n> Este plan **destruye o reemplaza ${destroys} recurso(s)**. Revísalo con cuidado.\n`
              : '';
            const body = `${marker}
            ### Terraform plan — \`${env}\`
            **${summary}**
            ${warning}
            <details><summary>Ver plan</summary>

            \`\`\`hcl
            ${plan.slice(0, 60000)}
            \`\`\`
            </details>

            _Workflow: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Guardar plan como artefacto
        if: inputs.apply
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform/envs/${{ inputs.environment }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: ${{ inputs.destroy && 'destroy' || 'apply' }} (${{ inputs.environment }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # El environment es la compuerta: rama permitida, aprobadores y el rol de deploy.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.out.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.environment }}
    outputs:
      app_url: ${{ steps.out.outputs.app_url }}
      applied: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vars.APPLY_ENABLED es una variable del GitHub Environment de este job.
      - name: Interruptor de costos (APPLY_ENABLED)
        id: gate
        env:
          TARGET_ENV: ${{ inputs.environment }}
          APPLY_ENABLED: ${{ vars.APPLY_ENABLED }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          if [ "$DESTROY" = "true" ] || [ "$APPLY_ENABLED" != "false" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLY_ENABLED=false en $TARGET_ENV: aprobado, pero no se crean recursos."
            echo "Apply de \`$TARGET_ENV\` **omitido**: \`APPLY_ENABLED=false\` en el environment (control de costos)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Credenciales AWS (OIDC, rol de deploy del ambiente)
        if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Descargar plan aprobado
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform/envs/${{ inputs.environment }}

      - name: terraform init
        if: steps.gate.outputs.enabled == 'true'
        run: terraform init -lockfile=readonly

      # Se aplica el archivo de plan: si el state cambió desde el plan, Terraform
      # lo rechaza ("saved plan is stale") en lugar de aplicar algo no revisado.
      # Con destroy=true el archivo es un plan de destrucción.
      - name: terraform apply${{ inputs.destroy && ' (DESTROY)' || '' }}
        if: steps.gate.outputs.enabled == 'true'
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        id: out
        if: steps.gate.outputs.enabled == 'true' && !inputs.destroy
        run: echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

      # Inventario: qué quedó desplegado (o qué se eliminó) en este ambiente.
      # Dos fuentes: el state de Terraform y los tags reales en AWS
      # (Project + Environment), que también delatarían recursos huérfanos.
      - name: Inventario de recursos
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          {
            if [ "$DESTROY" = "true" ]; then
              echo "## Recursos eliminados — \`$TARGET_ENV\`"
              echo
              echo '| Recurso (Terraform) |'
              echo '|---|'
              terraform show -json tfplan \
                | jq -r '.resource_changes[] | select(.change.actions | index("delete")) | select(.mode == "managed") | "| `\(.address)` |"'
            else
              echo "## Inventario — \`$TARGET_ENV\`"
              echo
              echo "**URL:** $(terraform output -raw app_url 2>/dev/null || echo n/a)"
              echo
              echo '### Por módulo (state de Terraform)'
              echo
              echo '| Módulo | Recursos |'
              echo '|---|---|'
              terraform state list | grep -vE '(^|\.)data\.' \
                | awk -F. '{m = ($1 == "module") ? $2 : "(raíz)"; n[m]++} END {for (k in n) print "| " k " | " n[k] " |"}' \
                | sort
              echo
              echo '<details><summary>Lista completa (state)</summary>'
              echo
              echo '```'
              terraform state list | grep -vE '(^|\.)data\.'
              echo '```'
              echo '</details>'
            fi
            echo
            if [ "$DESTROY" = "true" ]; then
              # La API de tags de AWS tarda en reflejar borrados (y conserva las task
              # definitions INACTIVE), así que tras un destroy se consulta el ESTADO
              # real de cada recurso clave.
              name="prueba-devops-$TARGET_ENV"
              vpcs=$(aws ec2 describe-vpcs --filters Name=tag:Project,Values=prueba-devops Name=tag:Environment,Values="$TARGET_ENV" --query 'length(Vpcs)')
              nats=$(aws ec2 describe-nat-gateways --filter Name=tag:Environment,Values="$TARGET_ENV" Name=tag:Project,Values=prueba-devops Name=state,Values=pending,available,deleting --query 'length(NatGateways)')
              eips=$(aws ec2 describe-addresses --filters Name=tag:Environment,Values="$TARGET_ENV" Name=tag:Project,Values=prueba-devops --query 'length(Addresses)')
              albs=$(aws elbv2 describe-load-balancers --names "$name-alb" --query 'length(LoadBalancers)' 2>/dev/null || echo 0)
              ecs=$(aws ecs describe-clusters --clusters "$name-cluster" --query "length(clusters[?status=='ACTIVE'])")
              echo "### Verificación en AWS"
              echo
              echo '| Recurso | Activos |'
              echo '|---|---|'
              echo "| VPC | $vpcs |"
              echo "| NAT Gateway | $nats |"
              echo "| Elastic IP | $eips |"
              echo "| ALB | $albs |"
              echo "| ECS cluster | $ecs |"
              echo
              if [ $((vpcs + nats + eips + albs + ecs)) -eq 0 ]; then
                echo "✅ **$TARGET_ENV no tiene recursos con costo en AWS.**"
              else
                echo "⚠️ Quedan recursos activos; revisar."
                echo "::warning::Quedan recursos activos en $TARGET_ENV" >&2
              fi
            else
              echo "### Recursos en AWS con tags Project=prueba-devops, Environment=$TARGET_ENV"
              echo
              echo "_Fuente independiente de Terraform: sirve para detectar recursos huérfanos. Se omiten tareas y revisiones de task definition (efímeras)._"
              echo
              arns="$(aws resourcegroupstaggingapi get-resources \
                --tag-filters Key=Project,Values=prueba-devops Key=Environment,Values="$TARGET_ENV" \
                --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' \
                | grep -vE ':task/|:task-definition/' | sed '/^$/d')"
              echo '| Servicio | Tipo | ARN |'
              echo '|---|---|---|'
              echo "$arns" | awk -F: '{split($6, r, "/"); print "| " $3 " | " r[1] " | `" $0 "` |"}' | sort
            fi
          } >> "$GITHUB_STEP_SUMMARY"
