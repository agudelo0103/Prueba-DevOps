# -----------------------------------------------------------------------------
# CI — corre en cada Pull Request hacia main. Nada llega a main sin pasar esto.
#
#   secret-scan      Gitleaks sobre todo el historial
#   app-quality      ruff (lint/format) + pytest
#   app-image        build de la imagen + Trivy (bloquea HIGH/CRITICAL)
#   tf-static        fmt, validate, TFLint, Checkov (IaC security)
#   tf-plan          plan de dev y prod con rol de SOLO LECTURA, comentado en el PR
#   ci-ok            check único requerido por la protección de rama
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.4

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'terraform/**'
              - '.tflint.hcl'
              - '.checkov.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_terraform.yml'

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  app-quality:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incluye reglas de seguridad bandit "S")
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q

  app-image:
    needs: app-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: prueba-devops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — reporte (SARIF a la pestaña Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prueba-devops-api:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Trivy — gate (falla con HIGH/CRITICAL corregibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prueba-devops-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  tf-static:
    name: tf-static (fmt, validate, tflint, checkov)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for stack in terraform/bootstrap terraform/envs/*/; do
            echo "::group::validate $stack"
            terraform -chdir="$stack" init -backend=false -lockfile=readonly >/dev/null
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          for stack in terraform/bootstrap terraform/envs/*/; do
            tflint --chdir="$stack" --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Checkov (seguridad de IaC)
        run: |
          pip install --quiet checkov==3.3.20
          checkov -d terraform --config-file .checkov.yaml \
            -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov-iac

  tf-plan:
    needs: [changes, tf-static]
    # Dependabot no recibe token OIDC; sus PRs se validan con los checks estáticos.
    if: needs.changes.outputs.terraform == 'true' && github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: ${{ matrix.environment }}
      apply: false

  # Único check requerido en la protección de rama: agrega el resultado de todos.
  ci-ok:
    if: always()
    needs: [changes, secret-scan, app-quality, app-image, tf-static, tf-plan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verificar resultado
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Uno o más checks fallaron"; exit 1
          fi
